- q: 孩子成绩不好怎么办
  keywords: [成绩不好, 考得差, 跟不上, 基础差, 怎么提高, 担心]
  reply: |
    家长您别太焦虑。刚上高一很多孩子都会有一段适应期——高中知识跨度大，跟不上正常。咱们衔接课的目的就是帮孩子提前把高一上的重点难点过一遍，开学后至少能跟上老师的节奏。数学的集合、逻辑、不等式与函数这些，提前接触过再听校内老师讲，理解起来会轻松很多。

    另外建议您也多鼓励孩子，高一第一次月考成绩不好不代表什么，关键是找到方法。上完咱们的课，老师会对每个孩子有一个初步评估，可以给您反馈一下孩子的学科薄弱点。

- q: 孩子偏科怎么办
  keywords: [偏科, 某科差, 不喜欢, 学不会, 文理, 薄弱]
  reply: |
    偏科是很常见的。高中阶段，我们建议理科弱的先补数学和物理（这两科是理综的基础），文科弱的先补语文和英语。
    咱们的小班课会针对每个孩子的情况做分层——基础薄弱的先从概念理解入手，学得快的可以适当往前推进。试听一节课让孩子感受一下老师的教学方式，看看能不能提起兴趣。

- q: 孩子对学习没兴趣
  keywords: [没兴趣, 不想学, 厌学, 抵触, 逼着学, 没动力]
  reply: |
    这个年龄段的孩子反感"被安排"很正常。建议您换一种方式——不要说"我给你报了班"，而是说"咱们去体验一节，你要觉得不好就换"。

    孩子学习动力不够，往往是因为难度一下子提上来了，之前自学的习惯可能还没建立起来。咱们老师的风格是启发式教学，不是填鸭，很多学生上完第一节就觉得"原来这个也没那么难"。可以先试试试听课，让孩子自己做决定。

- q: 孩子学习压力大怎么办
  keywords: [压力大, 焦虑, 失眠, 太累, 受不, 心理, 担心]
  reply: |
    家长您关注到孩子的情绪已经很细心了。以下几点供您参考：

    ① 不要拿"别人家的孩子"比——新高一阶段，适应比排名重要
    ② 每天留点自由时间——哪怕半小时运动或发呆，缓解压力
    ③ 关注睡眠——高中生至少保证7小时，熬夜刷题效率反而低
    ④ 如果持续情绪低落超过两周，建议跟学校心理老师聊聊

    咱们课堂氛围比较轻松，老师也注重跟学生的互动，不会给孩子额外的精神负担。您如果有具体担心的事，也可以随时跟我聊。

- q: 想跟老师聊聊孩子情况
  keywords: [跟老师聊, 反馈, 了解一下, 学得怎么样, 上课表现]
  reply: |
    没问题！每节课后老师会在家长群做简要反馈。如果想单独聊，您可以加授课老师微信，或者约个时间在接送孩子的时候当面聊10分钟。您主要想了解哪方面——课堂表现、作业完成情况、还是考试成绩分析？我帮您提前跟老师说一下。

