# ═══════════════════════════════
# 六、课程内容类
# ═══════════════════════════════

- q: 数学教什么
  keywords: [数学, 集合, 逻辑, 不等式, 函数, 高一数学]
  reply: |
    新高一数学第一阶段主要讲：集合、逻辑、不等式与函数。这是高一上学期期中考试的核心内容。这些概念从初中到高中跨度很大——特别是函数从具体到抽象的转变，是大部分学生最不适应的点。咱们老师会从基础概念入手，帮孩子建立高中数学思维。

- q: 物理教什么
  keywords: [物理, 力的分解, 牛顿, 重力, 高一物理]
  reply: |
    物理第一阶段重点讲**力的分解**，这是高一物理的第一个难点。如果学生吸收得好，老师会继续往下讲牛顿第一定律和重力加速度。高中物理对数学基础要求高，特别是向量和三角函数——咱们老师会在讲物理的同时帮孩子补上需要的数学工具。

- q: 化学教什么
  keywords: [化学, 金属, 化合物, 高一化学, 方程式]
  reply: |
    化学第一阶段讲**金属化合物**，涉及钠、铝、铁等重要金属元素及其化合物的性质和反应方程式。这是高一化学的核心章节，也是高考必考内容。老师会带学生做实验演示（有视频辅助），帮孩子建立化学实验思维，不只是死记硬背方程式。

- q: 语文怎么教
  keywords: [语文, 阅读, 作文, 文言文, 专题]
  reply: |
    语文是分专题讲，不按照课本顺序。主要覆盖：古诗文阅读与鉴赏、现代文阅读技巧、议论文写作方法。高中语文和初中最大的区别是重思维深度轻标准答案。咱们的语文培优课重点训练孩子的文本分析能力和议论文写作，这两项是高考拉分的关键。

- q: 英语怎么教
  keywords: [英语, 语法, 阅读, 单词, 高一英语, 培优]
  reply: |
    英语培优课重点在阅读理解和语法体系的搭建。新高考英语阅读难度大幅提高，词汇量要求从初中1500词跳到高中3500词。咱们老师会系统梳理高中核心语法、带着孩子精读高考真题难度的文章、积累高频词汇和短语。课上不讲"死记硬背"，而是教孩子用词根词缀推断词义、用文章结构抓主旨。

# ═══════════════════════════════
# 七、家长黏连度类
# ═══════════════════════════════

- q: 要不要继续报班
  keywords: [继续报, 还要上吗, 下期, 续报, 效果]
  reply: |
    这个看孩子的感受和您观察到的变化。建议关注以下几点：
    ① 孩子上课是否主动（不是被您催着来）
    ② 回学校后该科目的作业完成度有没有提高
    ③ 月考或期中考该科目的排名变化

    如果以上有1-2项有明显改善，说明课是有效的。咱们老师会在课程结束前给每个孩子一份评估建议，帮您判断是否需要继续。

- q: 初升高衔接重要吗
  keywords: [衔接, 初中升高, 必要, 有用吗, 不报行不行]
  reply: |
    说实话——非常有必要。高中和初中知识不是一个量级。举个例子：初中三年学六本数学书，高中一年就要学完四本——进度快、深度大。不提前接触的话，60%以上的学生高一第一次月考会明显下滑。不光是知识衔接，还有学习方法的转变——高中更需要自学能力和逻辑思维，这些光靠学校老师灌输是不够的。

- q: 有没有老学员分享
  keywords: [之前的, 去年, 效果, 评价, 口碑, 成绩, 考得好]
  reply: |
    有的！去年暑假上了咱们新高一衔接课的学员，大部分在高一期中考中数学和物理排到了班级前50%。有几个比较突出的案例：一个初中数学基础一般的孩子，上了衔接课后开学数学月考考了班级第8名；还有一个物理从零开始的学生，上完课物理期中83分。

    如果您感兴趣，开课后可以在咱们家长微信群里看到完整的上课记录、精彩互动统计以及学员心得反馈~

- q: 能帮忙看下孩子的学习规划吗
  keywords: [规划, 计划, 建议, 怎么学, 下学期, 选科]
  reply: |
    当然可以！您方便告诉我孩子目前的情况吗？
    - 初中哪个科目最薄弱？
    - 平时学习习惯怎么样？（主动学还是需要督促）
    - 高中有没有初步的选科方向？（物理类还是历史类）

